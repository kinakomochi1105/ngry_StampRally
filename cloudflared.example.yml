# Cloudflare Tunnel configuration for the festival stamp rally.
#
# Copy to `cloudflared.yml`, fill in the two IDs below, then run:
#   npm run tunnel
#
# `cloudflared.yml` and the credentials JSON are gitignored: the credentials
# file is a secret that grants access to the tunnel.

# From `cloudflared tunnel create festival-rally`.
tunnel: REPLACE_WITH_TUNNEL_ID
credentials-file: REPLACE_WITH_PATH_TO/<TUNNEL_ID>.json

# Cloudflare terminates TLS at the edge and forwards plain HTTP to the dev
# server. The app reads X-Forwarded-Proto, so cookies still get `Secure` and
# the origin check still passes.
ingress:
  - hostname: hiroguru.mydns.jp
    service: http://localhost:3000
    originRequest:
      # The QR scanner posts image frames; keep the default body limits but
      # allow a slow phone on venue Wi-Fi to finish its request.
      connectTimeout: 30s
      noTLSVerify: false
  # Required catch-all.
  - service: http_status:404
